databases:
  - name: meshtorrents-db
    plan: free
    databaseName: meshtorrents
    user: meshtorrents

services:
  - type: web
    name: meshtorrents-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: meshtorrents-db
          property: connectionString
      - key: PROWLARR_URL
        value: http://localhost:9696
      - key: PROWLARR_API_KEY
        sync: false
      - key: SCRAPE_INTERVAL_HOURS
        value: "6"
